[package]
name = "tantivy-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "tantivy_native"
path = "src/lib.rs"

[[bin]]
name = "build_index"
path = "src/build_index.rs"

[[bin]]
name = "build_md"
path = "src/build_md.rs"

[[bin]]
name = "pack_md"
path = "src/pack_md.rs"

[[bin]]
name = "query_md"
path = "src/query_md.rs"

[[bin]]
name = "inspect_blob"
path = "src/inspect_blob.rs"

[[bin]]
name = "pack_shards"
path = "src/pack_shards.rs"

[dependencies]
tantivy = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
