[package]
name = "tantivy-search"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"
wasm-bindgen = "0.2"

[dependencies.tantivy]
version = "0.26"
default-features = false
features = ["lz4-compression"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
# tantivy generates uuid v4 segment ids; on wasm32 uuid needs an explicit
# randomness source (getrandom 0.4 wasm_js, same as above).
uuid = { version = "1", features = ["rng-getrandom"] }

[dev-dependencies]
tantivy-native = { path = "../tantivy-native" }

[profile.release]
opt-level = "s"
lto = true
