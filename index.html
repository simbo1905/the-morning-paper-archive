<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Morning Paper</title>
  <link rel="stylesheet" href="web/src/styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>

  <header>
    <h1>The Morning Paper</h1>
    <p class="subtitle">Adrian Colyer's blog — 995 papers, searchable</p>
  </header>

  <div id="status" class="status">Loading...</div>

  <main id="main-view">
    <details class="word-cloud-section" open>
      <summary>Tag cloud — click a tag to filter</summary>
      <div id="word-cloud" style="width: 100%; height: 300px;"></div>
    </details>

    <section class="search-section">
      <div class="search-row">
        <input
          type="search"
          id="search-input"
          placeholder="Search papers..."
          aria-label="Search papers"
          autocomplete="off">
        <label class="fuzzy-toggle-label">
          <input type="checkbox" id="fuzzy-toggle">
          Fuzzy
        </label>
        <span id="search-mode" class="search-mode dumb">string</span>
      </div>

      <div class="tag-filter">
        <input
          type="text"
          id="tag-input"
          list="tag-list"
          placeholder="Type a tag to filter..."
          aria-label="Filter by tag"
          autocomplete="off">
        <datalist id="tag-list"></datalist>
        <div id="selected-tags" class="selected-tags"></div>
      </div>

      <div class="result-info">
        <span id="result-count"></span>
        <span id="timing" class="timing"></span>
      </div>
    </section>

    <section id="results" class="results"></section>

    <div id="scroll-sentinel"></div>
  </main>

  <section id="blog-view" style="display:none">
    <a href="#" class="back-link">Back to results</a>
    <blog-post id="blog-post"></blog-post>
  </section>

  <footer>
    <p>Data from <a href="https://blog.acolyer.org" target="_blank" rel="noopener">blog.acolyer.org</a></p>
  </footer>

  <script type="module">
    import { init, setupInfiniteScroll } from "./web/src/app.js";
    import "./web/src/components.js";

    init().then(() => setupInfiniteScroll()).catch(err => {
      document.getElementById("status").textContent = "Error: " + err.message;
    });
  </script>
</body>
</html>
